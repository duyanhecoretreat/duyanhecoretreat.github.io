<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eco Retreat 360°</title>

  <link rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">

  <script
  src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js">
  </script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #panorama {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>

<body>

<div id="panorama"></div>

<script>
pannellum.viewer('panorama', {
    "default": {
        "firstScene": "scene1",
        "autoLoad": true,
        "autoRotate": -2,
        "sceneFadeDuration": 1000
    },

    "scenes": {
        "scene1": {
            "title": "Điểm 360 - 01",
            "type": "equirectangular",
            "panorama": "360-01.jpg",
            "hotSpots": [
                {
                    "pitch": -10,
                    "yaw": 30,
                    "type": "scene",
                    "text": "Đi tới điểm 02",
                    "sceneId": "scene2"
                }
            ]
        },

        "scene2": {
            "title": "Điểm 360 - 02",
            "type": "equirectangular",
            "panorama": "360-02.jpg",
            "hotSpots": [
                {
                    "pitch": -10,
                    "yaw": 30,
                    "type": "scene",
                    "text": "Đi tới điểm 03",
                    "sceneId": "scene3"
                },
                {
                    "pitch": -10,
                    "yaw": -30,
                    "type": "scene",
                    "text": "Quay lại điểm 01",
                    "sceneId": "scene1"
                }
            ]
        },

        "scene3": {
            "title": "Điểm 360 - 03",
            "type": "equirectangular",
            "panorama": "360-03.jpg",
            "hotSpots": [
                {
                    "pitch": -10,
                    "yaw": -30,
                    "type": "scene",
                    "text": "Quay lại điểm 02",
                    "sceneId": "scene2"
                }
            ]
        }
    }
});
</script>

</body>
</html>
