<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eco Retreat 360°</title>

  <link rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">

  <script
  src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js">
  </script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #panorama {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>

<body>

<div id="panorama"></div>

<script>
pannellum.viewer('panorama', {
    type: 'equirectangular',

    panorama: '360-01.jpg',

    autoLoad: true,
    autoRotate: -2,

    showZoomCtrl: true,
    showFullscreenCtrl: true,

    compass: false,

    hfov: 100
});
</script>

</body>
</html>
